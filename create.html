<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdeaFlow - Новая идея</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="create.css">
</head>

<body>


    <nav class="navbar navbar-expand-md sticky-top">
        <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center">

            <a class="navbar-brand" href="index.html">IdeaFlow</a>

            <div class="search-container d-none d-md-block mx-auto">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Поиск идей...">
            </div>

            <div class="ms-auto">
                <a href="create.html" class="btn btn-accent d-flex align-items-center gap-1">
                    <i class="bi bi-plus-lg"></i> Новая идея
                </a>
            </div>

            <div class="search-container d-md-none w-100">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Поиск идей...">
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <div class="col-md-3 col-lg-2 sidebar">
                <div class="sidebar-title">Навигация</div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Активные темы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Мои подписки</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Профиль</a>
                    </li>
                </ul>
            </div>


            <div class="col-md-9 col-lg-10 main-content">
                <h1 class="page-title">Новая идея</h1>
                <p class="page-subtitle">Поделитесь идеей с сообществом. Опишите суть, проблему и предлагаемое решение.
                </p>

                <form class="form-card" action="index.html" method="get">

                    <div class="mb-4">
                        <label for="ideaTitle" class="form-label">Название идеи <span class="required">*</span></label>
                        <input type="text" class="form-control" id="ideaTitle" name="title"
                            placeholder="Коротко и ёмко, например: Платформа для шеринга инструментов" maxlength="120"
                            required>
                        <div class="form-hint">До 120 символов. Хорошее название сразу передаёт суть.</div>
                    </div>


                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="ideaCategory" class="form-label">Категория</label>
                            <select class="form-select" id="ideaCategory" name="category">
                                <option value="" selected disabled>Выберите категорию</option>
                                <option value="tech">Технологии</option>
                                <option value="city">Городская среда</option>
                                <option value="social">Социальные проекты</option>
                                <option value="eco">Экология</option>
                                <option value="education">Образование</option>
                                <option value="other">Другое</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="ideaTags" class="form-label">Теги</label>
                            <input type="text" class="form-control" id="ideaTags" name="tags"
                                placeholder="Через запятую: шеринг, соседи, инструменты">
                            <div class="form-hint">Помогает другим найти вашу идею.</div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="ideaDescription" class="form-label">Описание идеи <span
                                class="required">*</span></label>
                        <textarea class="form-control" id="ideaDescription" name="description"
                            placeholder="Опишите проблему, которую решает идея, и как вы предлагаете её решить..."
                            maxlength="1000" required></textarea>
                        <div class="char-counter"><span id="charCount">0</span> / 1000</div>
                    </div>
                    <div class="mb-4">
                        <label for="ideaAuthor" class="form-label">Ваше имя <span class="required">*</span></label>
                        <input type="text" class="form-control" id="ideaAuthor" name="author"
                            placeholder="Как вас подписать под идеей" required>
                    </div>

                    <div class="form-actions">
                        <a href="index.html" class="btn btn-ghost">Отмена</a>
                        <button type="submit" class="btn btn-accent d-flex align-items-center gap-1">
                            <i class="bi bi-send"></i> Опубликовать идею
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
